name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those into main: a stack of PRs, each based on the one before,
  # otherwise gets no CI until its bottom PR merges.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS)
    # GA image, and arm64, which MLX requires.
    runs-on: macos-26
    # A full cold run is ~5 minutes. Fail fast rather than sit on a hung test.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # mlx-swift declares `swift-tools-version: 6.3;(experimentalCGen)`, so the package graph
      # only resolves on a toolchain that new. The image default is older, so select the newest
      # Xcode present rather than pinning a version that ages out of the image — macos-26 carries
      # Xcode 26.6, which is Swift 6.3.3. (Xcode's marketing version runs ahead of its Swift
      # version; 26.x is new enough, despite the 27 in the tools requirement.)
      - name: Select an Xcode new enough for mlx-swift
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          sw_vers
          xcodebuild -version
          xcrun swift --version

      # The package graph is large (MLX, swift-nio, transformers); a cold resolve plus Metal
      # kernel compilation dominates the run. This used to cache only the checked-out package
      # *sources* (SourcePackages), so every run still recompiled every dependency from scratch —
      # the expensive part. Caching the whole derived-data tree (Build/Intermediates.noindex too)
      # lets a run with an unchanged Package.resolved restore already-compiled dependency object
      # files and skip straight to compiling this repo's own, always-changed sources.
      #
      # Safe to bust by hand (Actions tab → Caches) if a run ever looks suspiciously green or red
      # for no reason traceable to the diff — Xcode's own incremental-build hashing normally
      # prevents a stale artifact from masking a real change, but a corrupted cache entry is not
      # impossible.
      - name: Cache SwiftPM checkouts & build products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/ci
          key: spm-${{ runner.os }}-${{ hashFiles('SwiftOpenWork.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # As of Xcode 26 the Metal toolchain is a separately downloadable component rather
      # than part of the base install. mlx-swift compiles .metal kernel sources, so without
      # this the build fails at CompileMetalFile with "missing Metal Toolchain".
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Builds from the committed project.pbxproj rather than regenerating, so CI cannot
      # drift on an xcodegen version difference. If you change project.yml, run
      # `xcodegen generate` and commit the result.
      #
      # mlx-swift ships a CudaBuild build-tool plugin, and swift-huggingface uses macros.
      # Xcode gates both behind an interactive trust prompt that a developer answers once
      # per machine; a fresh runner has never answered it and nobody is there to click, so
      # the build fails with "must be enabled before it can be used". The skip flags accept
      # them non-interactively — safe here because the plugin set is pinned by
      # Package.resolved, but it does mean plugins run without a trust gate.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SwiftOpenWork.xcodeproj \
            -scheme SwiftOpenWork \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/ci \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            | tee xcodebuild.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
